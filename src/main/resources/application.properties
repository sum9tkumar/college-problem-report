# Server Port (Railway provides PORT variable)
server.port=${PORT:8080}

# Database Connection (Railway provides these)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/problem_report_db}
spring.datasource.username=${MYSQLUSER:root}

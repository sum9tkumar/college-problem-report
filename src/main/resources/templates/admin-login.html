<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #1a0d05, #2d1a3d, #3d1520, #1f1a4d, #2b1508);
            background-size: 500% 500%;
            animation: gradientShift 22s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            25%  { background-position: 50% 100%; }
            50%  { background-position: 100% 50%; }
            75%  { background-position: 50% 0%; }
            100% { background-position: 0% 50%; }
        }

        /* 5 orbs — one for each colour in the palette */
        .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; animation: float 16s ease-in-out infinite; }
        .orb1 { width: 340px; height: 340px; background: #dc2626; top: -90px; left: -90px; }                        /* RED */
        .orb2 { width: 380px; height: 380px; background: #a855f7; bottom: -110px; right: -110px; animation-delay: 4s; } /* PURPLE */
        .orb3 { width: 280px; height: 280px; background: #f97316; top: 40%; right: 12%; animation-delay: 8s; opacity: 0.35; } /* ORANGE */
        .orb4 { width: 300px; height: 300px; background: #3b82f6; bottom: 15%; left: 10%; animation-delay: 6s; opacity: 0.3; }  /* BLUE */
        .orb5 { width: 260px; height: 260px; background: #92400e; top: 10%; left: 40%; animation-delay: 10s; opacity: 0.35; } /* BROWN */

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(35px, -45px) scale(1.1); }
            66%      { transform: translate(-25px, 35px) scale(0.95); }
        }

        .glass-card {
            position: relative;
            z-index: 10;
            width: 420px;
            padding: 50px 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 200, 200, 0.18);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-align: center;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: cardEnter 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            overflow: hidden;
        }

        /* Top accent line — all 5 colours */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #dc2626, #f97316, #92400e, #a855f7, #3b82f6, #dc2626);
            background-size: 200% 100%;
            animation: gradientLine 8s linear infinite;
        }

        @keyframes gradientLine {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes cardEnter { to { opacity: 1; transform: translateY(0) scale(1); } }

        .avatar {
            display: inline-flex; align-items: center; justify-content: center;
            width: 75px; height: 75px; border-radius: 22px;
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.25), rgba(168, 85, 247, 0.25), rgba(59, 130, 246, 0.25));
            border: 1px solid rgba(255, 200, 200, 0.35);
            font-size: 34px; margin-bottom: 20px;
            animation: fadeUp 0.8s ease 0.4s both;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
        }

        h2 { color: #fff; font-size: 22px; font-weight: 600; margin-bottom: 8px; animation: fadeUp 0.8s ease 0.5s both; }
        .subtitle { color: rgba(255, 225, 230, 0.7); font-size: 13px; margin-bottom: 30px; animation: fadeUp 0.8s ease 0.6s both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-group { text-align: left; margin-bottom: 18px; animation: fadeUp 0.7s ease 0.8s both; }
        .form-group:nth-of-type(2) { animation-delay: 0.9s; }

        .form-group label {
            display: block;
            color: rgba(255, 230, 235, 0.85);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        /* Inputs — brownish tint (warm, subtle) */
        .glass-input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            background: rgba(146, 64, 14, 0.12);
            border: 1px solid rgba(146, 64, 14, 0.35);
            color: #fff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .glass-input:focus {
            background: rgba(146, 64, 14, 0.18);
            border-color: rgba(168, 85, 247, 0.7);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.22), 0 0 20px rgba(220, 38, 38, 0.25);
        }

        /* Button — 5-colour animated gradient */
        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #dc2626, #f97316, #92400e, #a855f7, #3b82f6, #dc2626);
            background-size: 300% 100%;
            border: none;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.7s ease 1s both, gradientLine 8s linear infinite;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
        }

        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }
        .glass-btn:hover::before { left: 100%; }

        .glass-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(220, 38, 38, 0.5), 0 0 40px rgba(168, 85, 247, 0.4);
        }

        .glass-btn:active { transform: translateY(-1px) scale(0.99); }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: rgba(255, 225, 230, 0.55);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
            animation: fadeUp 0.7s ease 1.2s both;
        }
        .back-link:hover { color: #fff; }

        @media (max-width: 480px) { .glass-card { width: 90%; padding: 40px 25px; } }
    </style>
</head>
<body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
    <div class="orb orb5"></div>

    <div th:if="${error}" style="background: rgba(255,80,80,0.2); border: 1px solid rgba(255,80,80,0.5); color: #ff9999; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 13px;" th:text="${error}"></div>

    <form th:action="@{/admin/login}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="glass-input" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="glass-input" required>
        </div>
        <button type="submit" class="glass-btn">🔓 Login</button>
    </form>

    <p style="margin-top: 18px; color: rgba(255,255,255,0.6); font-size: 13px;">
        New admin?
        <a th:href="@{/admin-register}">Register here</a>
    </p>

    <a th:href="@{/}" class="back-link">← Back to Home</a>
    </div>
</body>
</html>

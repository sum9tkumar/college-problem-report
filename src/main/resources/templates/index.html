<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Problem Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #6a11cb);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: float 12s ease-in-out infinite; }
        .orb1 { width: 300px; height: 300px; background: #667eea; top: -80px; left: -80px; }
        .orb2 { width: 350px; height: 350px; background: #f093fb; bottom: -100px; right: -100px; animation-delay: 3s; }
        .orb3 { width: 250px; height: 250px; background: #4facfe; top: 40%; right: 10%; animation-delay: 6s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(30px, -40px) scale(1.1); }
            66%      { transform: translate(-20px, 30px) scale(0.95); }
        }

        .glass-card {
            position: relative;
            z-index: 10;
            width: 440px;
            padding: 55px 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: cardEnter 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        @keyframes cardEnter { to { opacity: 1; transform: translateY(0) scale(1); } }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 32px;
            margin-bottom: 20px;
            animation: fadeUp 0.8s ease 0.4s both;
        }

        .glass-card h1 { color: #fff; font-size: 24px; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; animation: fadeUp 0.8s ease 0.5s both; }
        .glass-card .subtitle { color: rgba(255, 255, 255, 0.7); font-size: 14px; margin-bottom: 35px; font-weight: 300; animation: fadeUp 0.8s ease 0.7s both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            margin-bottom: 14px;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.7s ease forwards;
        }

        .glass-btn:nth-of-type(1) { animation-delay: 0.9s; }
        .glass-btn:nth-of-type(2) { animation-delay: 1.05s; }
        .glass-btn:nth-of-type(3) { animation-delay: 1.2s; }

        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }

        .glass-btn:hover::before { left: 100%; }

        .glass-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            color: #fff;
        }

        .glass-btn:active { transform: translateY(-1px) scale(0.99); }

        .btn-student:hover { box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6); }
        .btn-admin:hover   { box-shadow: 0 10px 30px rgba(240, 147, 251, 0.6); }

        .btn-icon { font-size: 18px; transition: transform 0.35s ease; }
        .glass-btn:hover .btn-icon { transform: scale(1.2) rotate(-5deg); }

        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            animation: fadeUp 0.7s ease 1.1s both;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.15); }
        .divider span { padding: 0 12px; }

        .footer-note { margin-top: 25px; font-size: 12px; color: rgba(255, 255, 255, 0.5); animation: fadeUp 0.7s ease 1.4s both; }

        @media (max-width: 480px) {
            .glass-card { width: 90%; padding: 40px 25px; }
            .glass-card h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="glass-card">
        <div class="logo-badge">🎓</div>
        <h1>College Problem Report</h1>
        <p class="subtitle">Report your problem. Track it. Get it resolved.</p>

        <a th:href="@{/student-login}" class="glass-btn btn-student">
            <span class="btn-icon">👨‍🎓</span> Student Login
        </a>
        <a th:href="@{/admin-login}" class="glass-btn btn-admin">
            <span class="btn-icon">🔐</span> Admin Login
        </a>

        <div class="divider"><span>OR</span></div>

        <a th:href="@{/track}" class="glass-btn">
            <span class="btn-icon">🔍</span> Track Without Login
        </a>

        <p class="footer-note">© 2025 College Problem Report System</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #6a11cb);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: float 12s ease-in-out infinite; }
        .orb1 { width: 300px; height: 300px; background: #667eea; top: -80px; left: -80px; }
        .orb2 { width: 350px; height: 350px; background: #f093fb; bottom: -100px; right: -100px; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(30px, -40px) scale(1.1); }
            66%      { transform: translate(-20px, 30px) scale(0.95); }
        }

        .glass-card {
            position: relative;
            z-index: 10;
            width: 420px;
            padding: 50px 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: cardEnter 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        @keyframes cardEnter { to { opacity: 1; transform: translateY(0) scale(1); } }

        .avatar {
            display: inline-flex; align-items: center; justify-content: center;
            width: 70px; height: 70px; border-radius: 20px;
            background: rgba(102, 126, 234, 0.25);
            border: 1px solid rgba(102, 126, 234, 0.5);
            font-size: 32px; margin-bottom: 20px;
            animation: fadeUp 0.8s ease 0.4s both;
        }

        h2 { color: #fff; font-size: 22px; font-weight: 600; margin-bottom: 8px; animation: fadeUp 0.8s ease 0.5s both; }
        .subtitle { color: rgba(255,255,255,0.65); font-size: 13px; margin-bottom: 30px; animation: fadeUp 0.8s ease 0.6s both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-group { text-align: left; margin-bottom: 18px; animation: fadeUp 0.7s ease 0.8s both; }
        .form-group:nth-of-type(2) { animation-delay: 0.9s; }

        .form-group label {
            display: block;
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .glass-input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(102, 126, 234, 0.7);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            border-radius: 14px;
            background: rgba(102, 126, 234, 0.35);
            border: 1px solid rgba(102, 126, 234, 0.6);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.7s ease 1s both;
        }

        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }
        .glass-btn:hover::before { left: 100%; }

        .glass-btn:hover {
            transform: translateY(-3px);
            background: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .glass-btn:active { transform: translateY(-1px) scale(0.99); }

        .register-link {
            margin-top: 18px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            animation: fadeUp 0.7s ease 1.1s both;
        }
        .register-link a { color: #667eea; text-decoration: none; font-weight: 500; }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
            animation: fadeUp 0.7s ease 1.2s both;
        }
        .back-link:hover { color: #fff; }

        @media (max-width: 480px) { .glass-card { width: 90%; padding: 40px 25px; } }
    </style>
</head>
<body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="glass-card">
        <div class="avatar">👨‍🎓</div>
        <h2>Student Login</h2>
        <p class="subtitle">Enter your roll number and password</p>

        <div th:if="${error}" style="background: rgba(255,80,80,0.2); border: 1px solid rgba(255,80,80,0.5); color: #ff9999; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 13px;" th:text="${error}"></div>

        <div th:if="${success}" style="background: rgba(80,255,120,0.2); border: 1px solid rgba(80,255,120,0.5); color: #99ff99; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 13px;" th:text="${success}"></div>

        <div th:if="${error}" style="background: rgba(255,80,80,0.2); border: 1px solid rgba(255,80,80,0.5); color: #ff9999; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 13px;" th:text="${error}"></div>

        <div th:if="${success}" style="background: rgba(80,255,120,0.2); border: 1px solid rgba(80,255,120,0.5); color: #99ff99; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 13px;" th:text="${success}"></div>

        <form th:action="@{/student/login}" method="post">
            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" name="roll" class="glass-input" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="glass-input" required>
            </div>
            <button type="submit" class="glass-btn">🔓 Login</button>
        </form>

        <p class="register-link">
            New student?
            <a th:href="@{/student-register}">Register here</a>
        </p>

        <a th:href="@{/}" class="back-link">← Back to Home</a>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            // Backend baad mein connect karenge
            window.location.href = "student-dashboard.html";
        }
    </script>
</body>
</html>
